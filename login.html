<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Sistem - Rumah Tangga Poltekbang Surabaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .aviation-bg {
      background-color: #081B33;
      background-image:
        radial-gradient(circle at 50% 15%, rgba(14, 116, 144, 0.28), transparent 55%),
        radial-gradient(circle at 85% 85%, rgba(20, 83, 45, 0.25), transparent 50%),
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }
  </style>
</head>
<body class="aviation-bg min-h-screen flex items-center justify-center p-4 relative overflow-hidden antialiased">

  <!-- ORNAMEN LATAR PENERBANGAN (RADAR & SILUET PESAWAT HALUS) -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <!-- Lingkaran Radar -->
    <div class="absolute -top-32 -right-32 w-[520px] h-[520px] rounded-full border border-white/10"></div>
    <div class="absolute -top-12 -right-12 w-[360px] h-[360px] rounded-full border border-dashed border-sky-400/15"></div>
    <div class="absolute -bottom-40 -left-40 w-[500px] h-[500px] rounded-full border border-white/10"></div>

    <!-- Ikon Pesawat & Lintasan Terbang -->
    <i class="fa-solid fa-plane-up text-white/[0.04] text-[180px] absolute top-10 left-10 -rotate-12"></i>
    <i class="fa-solid fa-plane text-sky-300/[0.05] text-[140px] absolute bottom-12 right-12 rotate-12"></i>
  </div>

  <!-- KARTU LOGIN UTAMA -->
  <div class="relative z-10 w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-white/15">
    <!-- Garis 3 Warna Khas Instansi -->
    <div class="h-1.5 w-full flex">
      <div class="w-1/3 bg-[#14532D]"></div>
      <div class="w-1/3 bg-[#D97706]"></div>
      <div class="w-1/3 bg-[#0B2545]"></div>
    </div>

    <div class="p-7 sm:p-9">
      <!-- Logo & Identitas Kampus -->
      <div class="text-center mb-6">
        <div class="w-20 h-20 mx-auto rounded-2xl bg-slate-50 border border-slate-200 p-2 flex items-center justify-center shadow-2xs">
          <img src="logo-poltekbang.png" alt="Logo Poltekbang Surabaya" class="max-h-full max-w-full object-contain">
        </div>
        <p class="text-[11px] font-extrabold uppercase tracking-wider text-[#14532D] mt-4">
          Kementerian Perhubungan • BPSDM Perhubungan
        </p>
        <h1 class="text-xl font-extrabold text-[#0B2545] mt-1">
          Politeknik Penerbangan Surabaya
        </h1>
        <p class="text-xs text-slate-500 mt-1">
          Sistem Informasi Layanan &amp; Monitoring Rumah Tangga
        </p>
      </div>

      <div class="border-t border-slate-100 my-5"></div>

      <!-- Pesan Error Login -->
      <div id="errorBox" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation shrink-0"></i>
        <span id="errorText">Email atau password salah.</span>
      </div>

      <!-- Form Login -->
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="emailInput" class="block text-xs font-bold text-slate-700 mb-1.5">
            Email Pengguna <span class="text-rose-600">*</span>
          </label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
            <input type="email" id="emailInput" required autocomplete="email"
              placeholder="nama@poltekbangsby.ac.id"
              class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-800 bg-slate-50/70 focus:bg-white focus:ring-2 focus:ring-[#0B2545] focus:border-[#0B2545] focus:outline-none transition">
          </div>
        </div>

        <div>
          <label for="passwordInput" class="block text-xs font-bold text-slate-700 mb-1.5">
            Password <span class="text-rose-600">*</span>
          </label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
            <input type="password" id="passwordInput" required autocomplete="current-password"
              placeholder="••••••••••••"
              class="w-full pl-10 pr-11 py-2.5 border border-slate-300 rounded-xl text-sm text-slate-800 bg-slate-50/70 focus:bg-white focus:ring-2 focus:ring-[#0B2545] focus:border-[#0B2545] focus:outline-none transition">
            <!-- Ikon Mata Lihat/Sembunyikan Sandi -->
            <button type="button" onclick="togglePasswordVisibility()" tabindex="-1"
              class="absolute right-3 top-2.5 p-1 text-slate-400 hover:text-[#0B2545] transition cursor-pointer"
              title="Tampilkan / Sembunyikan Password">
              <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btnSubmit"
          class="w-full py-3 bg-[#0B2545] hover:bg-[#133863] active:scale-[0.99] text-white font-bold rounded-xl text-sm shadow-md transition flex items-center justify-center gap-2 cursor-pointer mt-2">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span id="btnText">Masuk ke Sistem</span>
        </button>
      </form>

      <!-- Footer -->
      <p class="text-center text-[11px] text-slate-400 mt-6">
        Bidang Umum • Rumah Tangga Poltekbang Surabaya
      </p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bxthbzzslipaoztvqupw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_y44KWW3Si2wjLlBtXaDP7Q_rnkWZIn0';
    const ROLE_CACHE_KEY = 'rt_poltekbang_role_cache';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    (async function checkExistingSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) {
        window.location.replace('index.html');
      }
    })();

    function togglePasswordVisibility() {
      const pwd = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      document.getElementById('errorText').textContent = msg;
      box.classList.remove('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      document.getElementById('errorBox').classList.add('hidden');

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');

      btn.disabled = true;
      btn.classList.add('opacity-75');
      btnText.textContent = 'Memverifikasi Akun...';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        btn.disabled = false;
        btn.classList.remove('opacity-75');
        btnText.textContent = 'Masuk ke Sistem';
        showError('Login gagal: Periksa kembali email dan password Anda.');
        return;
      }

      const role = (data?.user?.app_metadata?.role || 'VIEWER').toUpperCase();
      sessionStorage.setItem(ROLE_CACHE_KEY, role);
      window.location.replace('index.html');
    }
  </script>
</body>
</html>
