<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Sistem - Rumah Tangga Poltekbang Surabaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0B1E38] min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
    <!-- GARIS AKSEN RESMI INSTANSI (HIJAU - EMAS - BIRU) -->
    <div class="h-1.5 w-full flex">
      <div class="w-1/3 bg-[#14532D]"></div>
      <div class="w-1/3 bg-[#D97706]"></div>
      <div class="w-1/3 bg-[#0B2545]"></div>
    </div>

    <!-- HEADER DENGAN LOGO POLTEKBANG SURABAYA (RATA TENGAH KE BAWAH) -->
    <div class="bg-white px-7 pt-7 pb-6 text-center border-b border-slate-100">
      <img src="logo-poltekbang.png" alt="Logo Politeknik Penerbangan Surabaya"
        class="h-24 w-auto mx-auto mb-3.5 object-contain">
      <p class="text-[11px] font-bold uppercase tracking-widest text-[#14532D]">
        Kementerian Perhubungan • BPSDM Perhubungan
      </p>
      <h1 class="text-xl font-extrabold text-[#0B2545] mt-1 leading-snug">
        Politeknik Penerbangan Surabaya
      </h1>
      <p class="text-xs font-medium text-slate-500 mt-1">
        Sistem Informasi Layanan & Monitoring Rumah Tangga
      </p>
    </div>

    <!-- FORM LOGIN -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="p-7 space-y-4 text-xs bg-slate-50/60">
      <div id="errBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-3.5 py-2.5 rounded-lg font-semibold"></div>

      <div>
        <label class="block font-bold text-slate-700 mb-1.5">Email Pengguna *</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-400"></i>
          <input type="email" id="email" required placeholder="nama@poltekbangsby.ac.id"
            class="w-full bg-white border border-slate-300 rounded-lg pl-10 pr-3.5 py-2.5 text-sm text-slate-800 focus:border-[#0B2545] focus:ring-2 focus:ring-[#0B2545]/15 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1.5">Password *</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400"></i>
          <input type="password" id="password" required placeholder="••••••••••••"
            class="w-full bg-white border border-slate-300 rounded-lg pl-10 pr-3.5 py-2.5 text-sm text-slate-800 focus:border-[#0B2545] focus:ring-2 focus:ring-[#0B2545]/15 focus:outline-none">
        </div>
      </div>

      <button type="submit" id="btnSubmit"
        class="w-full py-3 bg-[#0B2545] hover:bg-[#133863] text-white font-bold rounded-lg shadow-sm transition text-sm cursor-pointer">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Masuk ke Sistem
      </button>

      <div class="pt-2 text-center text-[11px] text-slate-400">
        Bidang Umum • Rumah Tangga Poltekbang Surabaya
      </div>
    </form>
  </div>

  <script>
    if (window.location.pathname !== '/') {
      window.history.replaceState(null, '', '/');
    }

    const sb = window.supabase.createClient(
      'https://bxthbzzslipaoztvqupw.supabase.co',
      'sb_publishable_y44KWW3Si2wjLlBtXaDP7Q_rnkWZIn0'
    );

    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.replace('index.html');
    });

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const errBox = document.getElementById('errBox');
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Memverifikasi...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errBox.innerText = 'Login gagal: Email atau password salah.';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1.5"></i> Masuk ke Sistem';
        return;
      }

      window.location.replace('index.html');
    }
  </script>
</body>
</html>
