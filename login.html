<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Sistem - Rumah Tangga Poltekbang Surabaya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
    <!-- HEADER -->
    <div class="bg-gradient-to-r from-slate-900 via-sky-900 to-sky-700 p-7 text-white text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-white/15 flex items-center justify-center text-2xl mb-3 shadow-md">
        <i class="fa-solid fa-plane-up"></i>
      </div>
      <p class="text-[10px] font-bold uppercase tracking-widest text-sky-300">BIDANG UMUM • POLTEKBANG SURABAYA</p>
      <h1 class="text-xl font-extrabold mt-1">Sistem Layanan Rumah Tangga</h1>
      <p class="text-xs text-sky-100/80 mt-1">Silakan masuk menggunakan akun resmi Anda</p>
    </div>

    <!-- FORM LOGIN -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="p-7 space-y-4 text-xs">
      <div id="errBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 px-3.5 py-2.5 rounded-xl font-semibold"></div>

      <div>
        <label class="block font-bold text-slate-700 mb-1.5">Email Pengguna *</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-slate-400"></i>
          <input type="email" id="email" required placeholder="admin@rumahtangga.ac.id"
            class="w-full border border-slate-300 rounded-xl pl-10 pr-3.5 py-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 mb-1.5">Password *</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400"></i>
          <input type="password" id="password" required placeholder="••••••••••••"
            class="w-full border border-slate-300 rounded-xl pl-10 pr-3.5 py-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>
      </div>

      <button type="submit" id="btnSubmit"
        class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-extrabold rounded-xl shadow-md transition text-sm cursor-pointer">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Masuk ke Aplikasi
      </button>
    </form>
  </div>

  <script>
    const sb = window.supabase.createClient(
      'https://bxthbzzslipaoztvqupw.supabase.co',
      'sb_publishable_y44KWW3Si2wjLlBtXaDP7Q_rnkWZIn0'
    );

    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.replace('index.html');
    });

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const errBox = document.getElementById('errBox');
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Memverifikasi...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errBox.innerText = 'Login gagal: Email atau password salah.';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-1.5"></i> Masuk ke Aplikasi';
        return;
      }

      window.location.replace('index.html');
    }
  </script>
</body>
</html>
