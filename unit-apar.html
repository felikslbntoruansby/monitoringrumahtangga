<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Kendali Digital APAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="text-slate-800 pb-10">

    <!-- HEADER MOBILE -->
    <header class="bg-red-700 text-white px-4 py-4 shadow-md sticky top-0 z-20">
        <div class="max-w-lg mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="bg-white/20 p-2 rounded-lg">
                    <i class="fas fa-fire-extinguisher text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Kartu Kendali Digital APAR</h1>
                    <p class="text-[11px] text-red-100">Inspeksi & Lapor Kondisi Lapangan</p>
                </div>
            </div>
            <a href="apar.html" class="text-xs bg-red-800 hover:bg-red-900 px-2.5 py-1.5 rounded-lg font-medium">
                Matriks <i class="fas fa-arrow-right ml-1"></i>
            </a>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 pt-4 space-y-4">

        <!-- LOADING / ERROR STATE -->
        <div id="statusBox" class="bg-white p-6 rounded-2xl shadow-sm text-center text-slate-500 text-sm">
            <i class="fas fa-spinner fa-spin text-red-600 text-xl mb-2"></i>
            <p>Memuat identitas tabung APAR...</p>
        </div>

        <!-- KARTU IDENTITAS TABUNG -->
        <div id="unitCard" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-start">
                <div>
                    <span id="badgeKategori" class="text-[10px] font-bold uppercase tracking-wider bg-red-600 px-2 py-0.5 rounded">G. UMUM</span>
                    <h2 id="txtKodeApar" class="text-2xl font-extrabold tracking-tight mt-1">APAR-000</h2>
                    <p id="txtLokasi" class="text-xs text-slate-300 mt-0.5">-</p>
                </div>
                <div id="statusPill" class="px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500 text-white">
                    SIAP PAKAI
                </div>
            </div>

            <div class="p-4 grid grid-cols-2 gap-3 text-xs border-b border-slate-100">
                <div class="bg-slate-50 p-2.5 rounded-xl">
                    <span class="text-slate-400 block">Media & Kapasitas</span>
                    <strong id="txtMedia" class="text-slate-800 text-sm">-</strong>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl">
                    <span class="text-slate-400 block">Merk Tabung</span>
                    <strong id="txtMerk" class="text-slate-800 text-sm">-</strong>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl col-span-2 flex justify-between items-center">
                    <div>
                        <span class="text-slate-400 block">Masa Berlaku / Wajib Refill</span>
                        <strong id="txtExpired" class="text-slate-800 text-sm">-</strong>
                    </div>
                    <span id="expiredWarning" class="hidden bg-red-100 text-red-700 font-bold px-2.5 py-1 rounded-lg text-[11px]">
                        <i class="fas fa-exclamation-triangle mr-1"></i> EXPIRED
                    </span>
                </div>
            </div>

            <!-- TOMBOL LAPOR KERUSAKAN / KENDALA (PUBLIK / UMUM) -->
            <div class="p-4 bg-white">
                <button onclick="openReportModal()" class="w-full py-3 bg-rose-600 hover:bg-rose-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <i class="fas fa-exclamation-triangle text-base"></i> Lapor APAR Rusak / Expired / Tekanan Drop
                </button>
            </div>
        </div>

        <!-- RIWAYAT & JADWAL INSPEKSI 12 BULAN -->
        <div id="historySection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
            <h3 class="font-bold text-sm text-slate-800 mb-3 flex items-center justify-between">
                <span><i class="fas fa-history text-red-600 mr-1.5"></i> Jadwal & Riwayat Inspeksi</span>
                <span id="progressText" class="text-xs font-semibold text-emerald-600">0/12 Selesai</span>
            </h3>
            <div id="scheduleList" class="space-y-2.5"></div>
        </div>
    </main>

    <!-- MODAL LAPOR KERUSAKAN / KENDALA APAR (PUBLIK) -->
    <div id="reportModal" class="fixed inset-0 bg-slate-900/70 hidden items-end sm:items-center justify-center z-50">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-base text-rose-700"><i class="fas fa-exclamation-circle mr-1.5"></i>Lapor Kendala / Kerusakan APAR</h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fas fa-times text-lg"></i></button>
            </div>

            <form id="reportForm" onsubmit="submitPublicReport(event)" class="space-y-3.5 text-sm">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pelapor / Unit Kerja *</label>
                    <input type="text" id="repPelapor" required placeholder="Contoh: Taruna / Staf Bagian Umum" class="w-full border border-slate-300 rounded-xl px-3 py-2.5">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Jenis Kendala / Kerusakan *</label>
                    <select id="repKendala" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 font-semibold">
                        <option value="Tekanan Drop / Jarum Merah">Jarum Tekanan Drop (Area Merah)</option>
                        <option value="Segel / Pin Pengaman Putus">Segel / Pin Pengaman Putus / Hilang</option>
                        <option value="Tabung Kadaluarsa / Perlu Refill">Masa Berlaku Habis / Perlu Refill</option>
                        <option value="Selang / Nozzle / Tabung Rusak">Selang Retak / Tabung Berkarat / Rusak</option>
                        <option value="APAR Sudah Digunakan">APAR Habis / Sudah Digunakan</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Keterangan Detail *</label>
                    <textarea id="repCatatan" rows="3" required placeholder="Jelaskan kondisi tabung APAR yang ditemukan di lokasi..." class="w-full border border-slate-300 rounded-xl px-3 py-2"></textarea>
                </div>

                <button type="submit" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-md transition cursor-pointer">
                    <i class="fas fa-paper-plane mr-1"></i> Kirim Laporan Kerusakan
                </button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script>
        const sb = window.supabase.createClient('https://bxthbzzslipaoztvqupw.supabase.co', 'sb_publishable_y44KWW3Si2wjLlBtXaDP7Q_rnkWZIn0');
        const params = new URLSearchParams(window.location.search);
        const kodeApar = params.get('kode') || params.get('unit');
        let unitSchedules = [];

        function showToast(msg, isErr = false) {
            const el = document.createElement('div');
            el.className = `${isErr ? 'bg-rose-600' : 'bg-emerald-600'} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold`;
            el.innerText = msg;
            document.getElementById('toast').appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        async function loadUnitApar() {
            const statusBox = document.getElementById('statusBox');
            if (!kodeApar) {
                statusBox.innerHTML = `<p class="text-red-600 font-bold">Kode APAR tidak ditemukan di URL QR Code.</p>`;
                return;
            }

            const { data, error } = await sb.from('apar').select('*').eq('kode_apar', kodeApar);
            if (error || !data || data.length === 0) {
                statusBox.innerHTML = `<p class="text-red-600 font-bold">Data unit APAR "${kodeApar}" tidak terdaftar di sistem.</p>`;
                return;
            }

            unitSchedules = data.sort((a, b) => new Date(a.tgl_inspeksi) - new Date(b.tgl_inspeksi));
            renderUnitDetail();
        }

        function renderUnitDetail() {
            document.getElementById('statusBox').classList.add('hidden');
            document.getElementById('unitCard').classList.remove('hidden');
            document.getElementById('historySection').classList.remove('hidden');

            const info = unitSchedules[0];
            const latest = [...unitSchedules].reverse().find(s => s.status !== 'Terjadwal') || info;
            const today = new Date().toISOString().split('T')[0];

            document.getElementById('badgeKategori').textContent = info.kategori_gedung || 'APAR';
            document.getElementById('txtKodeApar').textContent = info.kode_apar;
            document.getElementById('txtLokasi').textContent = `${info.gedung || ''} • ${info.titik_lokasi || ''}`;
            document.getElementById('txtMedia').textContent = `${info.jenis_media || '-'} (${info.kapasitas || '-'})`;
            document.getElementById('txtMerk').textContent = info.merk || '-';
            document.getElementById('txtExpired').textContent = info.tgl_kadaluarsa || '-';

            const isExpired = info.tgl_kadaluarsa && info.tgl_kadaluarsa < today;
            if (isExpired) document.getElementById('expiredWarning').classList.remove('hidden');

            const pill = document.getElementById('statusPill');
            if (latest.status === 'RUSAK') {
                pill.textContent = 'RUSAK';
                pill.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-red-600 text-white';
            } else if (latest.status === 'PERLU REFILL' || isExpired) {
                pill.textContent = 'PERLU REFILL';
                pill.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-amber-500 text-white';
            } else {
                pill.textContent = 'SIAP PAKAI';
                pill.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500 text-white';
            }

            const doneCount = unitSchedules.filter(s => s.status === 'BAIK').length;
            document.getElementById('progressText').textContent = `${doneCount}/${unitSchedules.length} Selesai`;

            const listEl = document.getElementById('scheduleList');
            listEl.innerHTML = unitSchedules.map((s, idx) => {
                let badge = 'bg-slate-100 text-slate-600';
                if (s.status === 'BAIK') badge = 'bg-emerald-100 text-emerald-700';
                else if (s.status === 'PERLU REFILL') badge = 'bg-amber-100 text-amber-700';
                else if (s.status === 'RUSAK') badge = 'bg-red-100 text-red-700';

                return `
                    <div class="p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-slate-800">Cek ke-${idx + 1} • ${s.tgl_inspeksi}</div>
                            <div class="text-slate-500 mt-0.5">Tekanan: ${s.tekanan_bar || 'Normal'} ${s.petugas ? `• Oleh: <b>${s.petugas}</b>` : ''}</div>
                            ${s.catatan ? `<div class="text-slate-400 italic mt-0.5">"${s.catatan}"</div>` : ''}
                        </div>
                        <span class="px-2.5 py-1 rounded-lg font-bold ${badge}">${s.status}</span>
                    </div>
                `;
            }).join('');
        }

        function openReportModal() {
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('reportModal').classList.add('flex');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportModal').classList.remove('flex');
        }

        async function submitPublicReport(e) {
            e.preventDefault();
            const info = unitSchedules[0];
            const today = new Date().toISOString().split('T')[0];
            const kendala = document.getElementById('repKendala').value;
            const pelapor = document.getElementById('repPelapor').value;
            const catatan = document.getElementById('repCatatan').value;

            const statusBaru = kendala.includes('Refill') ? 'PERLU REFILL' : 'RUSAK';
            const tekananBaru = kendala.includes('Tekanan') ? 'Kurang / Merah' : 'Perlu Cek';

            const { error } = await sb.from('apar').insert([{
                kode_apar: info.kode_apar,
                kategori_gedung: info.kategori_gedung,
                gedung: info.gedung,
                titik_lokasi: info.titik_lokasi,
                merk: info.merk,
                jenis_media: info.jenis_media,
                kapasitas: info.kapasitas,
                tgl_kadaluarsa: info.tgl_kadaluarsa,
                tgl_inspeksi: today,
                tekanan_bar: tekananBaru,
                kondisi_fisik: kendala,
                status: statusBaru,
                petugas: `Laporan: ${pelapor}`,
                catatan: `[${kendala}] ${catatan}`
            }]);

            if (error) return showToast('Gagal mengirim laporan: ' + error.message, true);

            document.getElementById('reportForm').reset();
            closeReportModal();
            showToast('Laporan kerusakan APAR berhasil dikirim!');
            loadUnitApar();
        }

        document.addEventListener('DOMContentLoaded', loadUnitApar);
    </script>
</body>
</html>
