<!DOCTYPE html>
<html lang="id" style="visibility:hidden;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Kendali Digital APAR - Poltekbang Surabaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="text-slate-800 pb-10">

    <!-- HEADER MOBILE -->
    <header class="bg-red-700 text-white px-4 py-4 shadow-md sticky top-0 z-20">
        <div class="max-w-lg mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="bg-white/20 p-2 rounded-lg">
                    <i class="fas fa-fire-extinguisher text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Kartu Kendali Digital APAR</h1>
                    <p class="text-[11px] text-red-100">Inspeksi & Lapor Kondisi Lapangan</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <a href="index.html" class="text-xs bg-red-800 hover:bg-red-900 px-2.5 py-1.5 rounded-lg font-medium">
                    <i class="fas fa-home"></i>
                </a>
                <a href="apar.html" class="text-xs bg-red-800 hover:bg-red-900 px-2.5 py-1.5 rounded-lg font-medium">
                    Daftar APAR <i class="fas fa-arrow-right ml-1"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 pt-4 space-y-4">

        <div id="statusBox" class="bg-white p-6 rounded-2xl shadow-sm text-center text-slate-500 text-sm">
            <i class="fas fa-spinner fa-spin text-red-600 text-xl mb-2"></i>
            <p>Memuat identitas titik APAR...</p>
        </div>

        <div id="unitCard" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-start">
                <div>
                    <span id="badgeKode" class="text-[10px] font-bold uppercase tracking-wider bg-red-600 px-2 py-0.5 rounded">GU</span>
                    <h2 id="txtNoUrut" class="text-2xl font-extrabold tracking-tight mt-1">APAR No. 1</h2>
                    <p id="txtLokasi" class="text-xs text-slate-300 mt-0.5">-</p>
                </div>
                <div id="statusPill" class="px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500 text-white">
                    MASIH
                </div>
            </div>

            <div class="p-4 grid grid-cols-2 gap-3 text-xs border-b border-slate-100">
                <div class="bg-slate-50 p-2.5 rounded-xl">
                    <span class="text-slate-400 block">Jenis APAR</span>
                    <strong id="txtJenis" class="text-slate-800 text-sm">-</strong>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl">
                    <span class="text-slate-400 block">Isi Tabung & QTY</span>
                    <strong id="txtIsiQty" class="text-slate-800 text-sm">-</strong>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl col-span-2 flex justify-between items-center">
                    <div>
                        <span class="text-slate-400 block">Masa Berlaku</span>
                        <strong id="txtMasaBerlaku" class="text-slate-800 text-sm">-</strong>
                    </div>
                    <span id="expiredWarning" class="hidden bg-amber-100 text-amber-800 font-bold px-2.5 py-1 rounded-lg text-[11px]">
                        <i class="fas fa-exclamation-triangle mr-1"></i> PERLU CEK
                    </span>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl col-span-2">
                    <span class="text-slate-400 block">Keterangan Terakhir</span>
                    <strong id="txtKeterangan" class="text-slate-800 text-xs">-</strong>
                </div>
            </div>

            <!-- TOMBOL LAPOR KERUSAKAN (SEMUA ROLE BISA ISI) -->
            <div class="p-4 bg-white border-b border-slate-100">
                <button onclick="openReportModal()" class="w-full py-3 bg-rose-600 hover:bg-rose-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <i class="fas fa-exclamation-triangle text-base"></i> Lapor APAR Rusak / Expired / Tidak Ada
                </button>
            </div>

            <!-- TOMBOL UPDATE INSPEKSI (TEKNISI & ADMIN) -->
            <div class="teknisi-only p-4 bg-slate-50">
                <button onclick="openCheckModal()" class="w-full py-3 bg-slate-800 hover:bg-slate-900 active:scale-[0.99] text-white font-bold rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm cursor-pointer">
                    <i class="fas fa-clipboard-check text-base"></i> Update Status & Masa Berlaku (Petugas)
                </button>
            </div>
        </div>
    </main>

    <!-- MODAL LAPOR KENDALA -->
    <div id="reportModal" class="fixed inset-0 bg-slate-900/70 hidden items-end sm:items-center justify-center z-50">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-base text-rose-700"><i class="fas fa-exclamation-circle mr-1.5"></i>Lapor Kendala APAR</h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fas fa-times text-lg"></i></button>
            </div>
            <form onsubmit="submitReport(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Pelapor *</label>
                    <input type="text" id="repPelapor" required placeholder="Nama / Unit Kerja" class="w-full border border-slate-300 rounded-xl px-3 py-2">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Kondisi Ditemukan *</label>
                    <select id="repKondisi" class="w-full border border-slate-300 rounded-xl px-3 py-2 font-semibold">
                        <option value="Tekanan Drop / Merah">Jarum Tekanan Drop (Merah)</option>
                        <option value="Kadaluarsa / Perlu Refill">Masa Berlaku Habis / Perlu Refill</option>
                        <option value="Tabung Rusak / Segel Putus">Tabung Rusak / Segel Putus</option>
                        <option value="Unit Tidak Ada di Lokasi">Unit Tidak Ada di Lokasi</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Catatan Tambahan</label>
                    <input type="text" id="repCatatan" placeholder="Keterangan singkat..." class="w-full border border-slate-300 rounded-xl px-3 py-2">
                </div>
                <button type="submit" class="w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl cursor-pointer">
                    Kirim Laporan
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL UPDATE PETUGAS -->
    <div id="checkModal" class="fixed inset-0 bg-slate-900/70 hidden items-end sm:items-center justify-center z-50">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-base text-slate-800">Update Data APAR</h3>
                <button onclick="closeCheckModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fas fa-times text-lg"></i></button>
            </div>
            <form onsubmit="saveInspection(event)" class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Jenis APAR</label>
                        <input type="text" id="inpJenis" class="w-full border border-slate-300 rounded-xl px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Isi Tabung</label>
                        <input type="text" id="inpIsi" class="w-full border border-slate-300 rounded-xl px-3 py-2">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Masa Berlaku</label>
                        <input type="text" id="inpMasa" class="w-full border border-slate-300 rounded-xl px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">QTY</label>
                        <input type="number" id="inpQty" min="0" class="w-full border border-slate-300 rounded-xl px-3 py-2">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Keterangan</label>
                    <input type="text" id="inpKet" class="w-full border border-slate-300 rounded-xl px-3 py-2">
                </div>
                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl cursor-pointer">
                    Simpan Perubahan
                </button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const noUrut = params.get('no');
        let currentUnit = null;

        function showToast(msg, isErr = false) {
            const el = document.createElement('div');
            el.className = `${isErr ? 'bg-rose-600' : 'bg-emerald-600'} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold`;
            el.innerText = msg;
            document.getElementById('toast').appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        async function loadUnit() {
            const statusBox = document.getElementById('statusBox');
            if (!noUrut) {
                statusBox.innerHTML = `<p class="text-red-600 font-bold">Nomor urut APAR tidak ditemukan pada URL QR Code.</p>`;
                return;
            }

            const { data, error } = await sb.from('apar').select('*').eq('no_urut', Number(noUrut)).single();
            if (error || !data) {
                statusBox.innerHTML = `<p class="text-red-600 font-bold">Data APAR No. ${escapeHtml(noUrut)} tidak ditemukan.</p>`;
                return;
            }

            currentUnit = data;
            document.getElementById('statusBox').classList.add('hidden');
            document.getElementById('unitCard').classList.remove('hidden');

            document.getElementById('badgeKode').textContent = data.kode_ruangan || '-';
            document.getElementById('txtNoUrut').textContent = `APAR No. ${data.no_urut}`;
            document.getElementById('txtLokasi').textContent = data.nama_lokasi || '-';
            document.getElementById('txtJenis').textContent = data.jenis_apar || '-';
            document.getElementById('txtIsiQty').textContent = `${data.isi_tabung || '-'} (${data.qty ?? 0} Unit)`;
            document.getElementById('txtMasaBerlaku').textContent = data.masa_berlaku || '-';
            document.getElementById('txtKeterangan').textContent = data.keterangan || '-';

            const qtyNum = Number(data.qty) || 0;
            const pill = document.getElementById('statusPill');
            if (qtyNum === 0) {
                pill.textContent = 'TIDAK ADA';
                pill.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-slate-600 text-white';
            } else {
                pill.textContent = (data.keterangan || 'TERSEDIA').toUpperCase();
                pill.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500 text-white';
            }
        }

        function openReportModal() {
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('reportModal').classList.add('flex');
        }
        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
            document.getElementById('reportModal').classList.remove('flex');
        }

        async function submitReport(e) {
            e.preventDefault();
            const pelapor = document.getElementById('repPelapor').value.trim();
            const kondisi = document.getElementById('repKondisi').value;
            const catatan = document.getElementById('repCatatan').value.trim();
            const ketBaru = `Lapor (${pelapor}): ${kondisi}${catatan ? ' - ' + catatan : ''}`;

            const { error } = await sb.from('apar').update({
                keterangan: ketBaru,
                updated_at: new Date().toISOString()
            }).eq('no_urut', currentUnit.no_urut);

            if (error) return showToast('Gagal mengirim laporan: ' + error.message, true);
            closeReportModal();
            showToast('Laporan kendala APAR berhasil diperbarui!');
            loadUnit();
        }

        function openCheckModal() {
            document.getElementById('inpJenis').value = currentUnit.jenis_apar || '';
            document.getElementById('inpIsi').value = currentUnit.isi_tabung || '';
            document.getElementById('inpMasa').value = currentUnit.masa_berlaku || '';
            document.getElementById('inpQty').value = currentUnit.qty ?? 0;
            document.getElementById('inpKet').value = currentUnit.keterangan || '';
            document.getElementById('checkModal').classList.remove('hidden');
            document.getElementById('checkModal').classList.add('flex');
        }
        function closeCheckModal() {
            document.getElementById('checkModal').classList.add('hidden');
            document.getElementById('checkModal').classList.remove('flex');
        }

        async function saveInspection(e) {
            e.preventDefault();
            const { error } = await sb.from('apar').update({
                jenis_apar: document.getElementById('inpJenis').value.trim() || '-',
                isi_tabung: document.getElementById('inpIsi').value.trim() || '-',
                masa_berlaku: document.getElementById('inpMasa').value.trim() || '-',
                qty: parseInt(document.getElementById('inpQty').value, 10) || 0,
                keterangan: document.getElementById('inpKet').value.trim() || '-',
                updated_at: new Date().toISOString()
            }).eq('no_urut', currentUnit.no_urut);

            if (error) return showToast('Gagal menyimpan: ' + error.message, true);
            closeCheckModal();
            showToast('Data APAR berhasil diperbarui!');
            loadUnit();
        }

        document.addEventListener('DOMContentLoaded', loadUnit);
    </script>
</body>
</html>
