<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Kendali Digital APAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="text-slate-800 pb-10">

    <!-- HEADER MOBILE -->
    <header class="bg-red-700 text-white px-4 py-4 shadow-md sticky top-0 z-20">
        <div class="max-w-lg mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="bg-white/20 p-2 rounded-lg">
                    <i class="fas fa-fire-extinguisher text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">Kartu Kendali Digital APAR</h1>
                    <p class="text-[11px] text-red-100">Inspeksi & Monitoring Lapangan</p>
                </div>
            </div>
            <a href="apar.html" class="text-xs bg-red-800 hover:bg-red-900 px-3 py-1.5 rounded-lg font-medium">
                Admin <i class="fas fa-arrow-right ml-1"></i>
            </a>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 pt-4 space-y-4">
        
        <!-- LOADING / ERROR STATE -->
        <div id="statusBox" class="bg-white p-6 rounded-2xl shadow-sm text-center text-slate-500 text-sm">
            <i class="fas fa-spinner fa-spin text-red-600 text-xl mb-2"></i>
            <p>Memuat identitas tabung APAR...</p>
        </div>

        <!-- KARTU IDENTITAS TABUNG -->
        <div id="unitCard" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-start">
                <div>
                    <span id="badgeKategori" class="text-[10px] font-bold uppercase tracking-wider bg-red-600 px-2 py-0.5 rounded">G. UMUM</span>
                    <h2 id="txtKodeApar" class="text-2xl font-extrabold tracking-tight mt-1">APAR-000</h2>
                    <p id="txtLokasi" class="text-xs text-slate-300 mt-0.5">-</p>
                </div>
                <div id="statusPill" class="px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500 text-white">
                    SIAP PAKAI
                </div>
            </div>

            <div class="p-4 grid grid-cols-2 gap-3 text-xs border-b border-slate-100">
                <div class="bg-slate-50 p-2.5 rounded-xl">
                    <span class="text-slate-400 block">Media & Kapasitas</span>
                    <strong id="txtMedia" class="text-slate-800 text-sm">-</strong>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl">
                    <span class="text-slate-400 block">Merk Tabung</span>
                    <strong id="txtMerk" class="text-slate-800 text-sm">-</strong>
                </div>
                <div class="bg-slate-50 p-2.5 rounded-xl col-span-2 flex justify-between items-center">
                    <div>
                        <span class="text-slate-400 block">Masa Berlaku / Wajib Refill</span>
                        <strong id="txtExpired" class="text-slate-800 text-sm">-</strong>
                    </div>
                    <span id="expiredWarning" class="hidden bg-red-100 text-red-700 font-bold px-2.5 py-1 rounded-lg text-[11px]">
                        <i class="fas fa-exclamation-triangle mr-1"></i> EXPIRED
                    </span>
                </div>
            </div>

            <!-- TOMBOL AKSI CEPAT PETUGAS -->
            <div class="p-4 bg-slate-50">
                <button onclick="openQuickCheck()" class="w-full py-3 bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-bold rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
                    <i class="fas fa-clipboard-check text-base"></i> Input Hasil Cek Bulan Ini
                </button>
            </div>
        </div>

        <!-- RIWAYAT & JADWAL INSPEKSI 12 BULAN -->
        <div id="historySection" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-4">
            <h3 class="font-bold text-sm text-slate-800 mb-3 flex items-center justify-between">
                <span><i class="fas fa-history text-red-600 mr-1.5"></i> Jadwal & Riwayat Inspeksi</span>
                <span id="progressText" class="text-xs font-semibold text-emerald-600">0/12 Selesai</span>
            </h3>
            <div id="scheduleList" class="space-y-2.5"></div>
        </div>
    </main>

    <!-- MODAL INPUT INSPEKSI LAPANGAN -->
    <div id="checkModal" class="fixed inset-0 bg-slate-900/70 hidden items-end sm:items-center justify-center z-50">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-bold text-base text-slate-800">Form Checklist Inspeksi APAR</h3>
                <button onclick="closeCheckModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fas fa-times text-lg"></i></button>
            </div>

            <form id="mobileInspectForm" onsubmit="saveMobileInspection(event)" class="space-y-3.5 text-sm">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Pilih Jadwal Bulan Inspeksi</label>
                    <select id="selectScheduleId" onchange="onSelectSchedule()" class="w-full border border-slate-300 rounded-xl px-3 py-2.5 bg-slate-50 font-semibold"></select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Jarum Tekanan (Pressure Gauge) *</label>
                    <select id="inpTekanan" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5">
                        <option value="Normal / Hijau">🟢 Normal / Area Hijau</option>
                        <option value="Kurang / Merah">🔴 Kurang / Area Merah (Drop)</option>
                        <option value="Overcharge">🟡 Overcharge (Berlebih)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">Checklist Kondisi Fisik</label>
                    <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="chk-fisik rounded text-red-600" value="Pin & Segel Utuh" checked>
                            <span>Pin pengaman & segel plastik masih utuh</span>
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="chk-fisik rounded text-red-600" value="Selang & Nozzle Baik" checked>
                            <span>Selang (hose) & corong tidak retak / tersumbat</span>
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="checkbox" class="chk-fisik rounded text-red-600" value="Tabung Dibalik/Dikocok" checked>
                            <span>Tabung sudah dibalik/dikocok (mencegah serbuk menggumpal)</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Kesimpulan Status APAR *</label>
                    <select id="inpStatus" required class="w-full border border-slate-300 rounded-xl px-3 py-2.5 font-bold">
                        <option value="BAIK">✅ BAIK (Siap Pakai)</option>
                        <option value="PERLU REFILL">⚠️ PERLU REFILL (Isi Ulang)</option>
                        <option value="RUSAK">❌ RUSAK (Tarik / Ganti Unit)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nama Petugas K3 / Teknisi *</label>
                    <input type="text" id="inpPetugas" required placeholder="Masukkan nama Anda..." class="w-full border border-slate-300 rounded-xl px-3 py-2.5">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Catatan Tambahan (Opsional)</label>
                    <textarea id="inpCatatan" rows="2" placeholder="Contoh: Kondisi bersih, posisi mudah dijangkau" class="w-full border border-slate-300 rounded-xl px-3 py-2"></textarea>
                </div>

                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition">
                    <i class="fas fa-save mr-1"></i> Simpan Hasil Inspeksi
                </button>
            </form>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const kodeApar = params.get('kode');
        let unitSchedules = [];

        async function loadUnitApar() {
            const statusBox = document.getElementById('statusBox');
            if (!kodeApar) {
                statusBox.innerHTML = `<p class="text-red-600 font-bold">Kode APAR tidak ditemukan di URL QR Code.</p>`;
                return;
            }

            try {
                const res = await fetch(`/api/apar?kode_apar=${encodeURIComponent(kodeApar)}`);
                const data = await res.json();

                if (!data || data.length === 0) {
                    statusBox.innerHTML = `<p class="text-red-600 font-bold">Data unit APAR "${kodeApar}" tidak terdaftar di sistem.</p>`;
                    return;
                }

                unitSchedules = data.sort((a, b) => new Date(a.tgl_inspeksi) - new Date(b.tgl_inspeksi));
                renderUnitDetail();
            } catch (err) {
                statusBox.innerHTML = `<p class="text-red-600 font-bold">Gagal terhubung ke server.</p>`;
            }
        }

        function renderUnitDetail() {
            document.getElementById('statusBox').classList.add('hidden');
            document.getElementById('unitCard').classList.remove('hidden');
            document.getElementById('historySection').classList.remove('hidden');

            const info = unitSchedules[0];
            const latest = [...unitSchedules].reverse().find(s => s.status !== 'Terjadwal') || info;
            const today = new Date().toISOString().split('T')[0];

            document.getElementById('badgeKategori').textContent = info.kategori_gedung || 'APAR';
            document.getElementById('txtKodeApar').textContent = info.kode_apar;
            document.getElementById('txtLokasi').textContent = `${info.gedung || ''} • ${info.titik_lokasi || ''}`;
            document.getElementById('txtMedia').textContent = `${info.jenis_media || '-'} (${info.kapasitas || '-'})`;
            document.getElementById('txtMerk').textContent = info.merk || '-';
            document.getElementById('txtExpired').textContent = info.tgl_kadaluarsa || '-';

            const isExpired = info.tgl_kadaluarsa && info.tgl_kadaluarsa < today;
            if (isExpired) document.getElementById('expiredWarning').classList.remove('hidden');

            const pill = document.getElementById('statusPill');
            if (latest.status === 'RUSAK') {
                pill.textContent = 'RUSAK';
                pill.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-red-600 text-white';
            } else if (latest.status === 'PERLU REFILL' || isExpired) {
                pill.textContent = 'PERLU REFILL';
                pill.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-amber-500 text-white';
            } else {
                pill.textContent = 'SIAP PAKAI';
                pill.className = 'px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-500 text-white';
            }

            const doneCount = unitSchedules.filter(s => s.status === 'BAIK').length;
            document.getElementById('progressText').textContent = `${doneCount}/${unitSchedules.length} Selesai`;

            const listEl = document.getElementById('scheduleList');
            listEl.innerHTML = unitSchedules.map((s, idx) => {
                let badge = 'bg-slate-100 text-slate-600';
                if (s.status === 'BAIK') badge = 'bg-emerald-100 text-emerald-700';
                else if (s.status === 'PERLU REFILL') badge = 'bg-amber-100 text-amber-700';
                else if (s.status === 'RUSAK') badge = 'bg-red-100 text-red-700';

                return `
                    <div class="p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                        <div>
                            <div class="font-bold text-slate-800">Cek ke-${idx + 1} • ${s.tgl_inspeksi}</div>
                            <div class="text-slate-500 mt-0.5">Tekanan: ${s.tekanan_bar || 'Normal'} ${s.petugas ? `• Oleh: <b>${s.petugas}</b>` : ''}</div>
                            ${s.catatan ? `<div class="text-slate-400 italic mt-0.5">"${s.catatan}"</div>` : ''}
                        </div>
                        <span class="px-2.5 py-1 rounded-lg font-bold ${badge}">${s.status}</span>
                    </div>
                `;
            }).join('');
        }

        function openQuickCheck() {
            const select = document.getElementById('selectScheduleId');
            select.innerHTML = unitSchedules.map((s, idx) =>
                `<option value="${s.id}">Cek ke-${idx + 1} (${s.tgl_inspeksi}) - [${s.status}]</option>`
            ).join('');

            // Otomatis pilih jadwal pertama yang statusnya masih 'Terjadwal'
            const nextPending = unitSchedules.find(s => s.status === 'Terjadwal');
            if (nextPending) select.value = nextPending.id;

            onSelectSchedule();
            document.getElementById('checkModal').classList.remove('hidden');
            document.getElementById('checkModal').classList.add('flex');
        }

        function onSelectSchedule() {
            const id = document.getElementById('selectScheduleId').value;
            const item = unitSchedules.find(s => String(s.id) === String(id));
            if (!item) return;
            document.getElementById('inpPetugas').value = item.petugas || '';
            document.getElementById('inpCatatan').value = item.catatan || '';
        }

        async function saveMobileInspection(e) {
            e.preventDefault();
            const id = document.getElementById('selectScheduleId').value;
            const checkedFisik = Array.from(document.querySelectorAll('.chk-fisik:checked')).map(c => c.value).join(', ');
            const today = new Date().toISOString().split('T')[0];

            const payload = {
                tgl_inspeksi: today,
                tekanan_bar: document.getElementById('inpTekanan').value,
                kondisi_fisik: checkedFisik || 'Dicek lapangan',
                status: document.getElementById('inpStatus').value,
                petugas: document.getElementById('inpPetugas').value,
                catatan: document.getElementById('inpCatatan').value
            };

            await fetch(`/api/apar/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            closeCheckModal();
            loadUnitApar();
        }

        function closeCheckModal() {
            document.getElementById('checkModal').classList.add('hidden');
            document.getElementById('checkModal').classList.remove('flex');
        }

        loadUnitApar();
    </script>
</body>
</html>
